<style>
  .mookh-spinner-container {
    width: 120px;
    height: 120px;
    display: inline-block;
  }

  .mookh-spinner {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  
  .spinner-logo-rotator {
    transform-origin: 540px 540px;
    animation: masterRotate 5s cubic-bezier(0.25, 1, 0.25, 0) infinite;
  }

  @keyframes masterRotate {
    0%, 80% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(180deg);
    }
  }

  
  .pulse-layer {
    transform-origin: 540px 540px;
    animation: pillPulse 5s cubic-bezier(0, 1, 1, 0) infinite;
  }

  
  .color-1 { animation-delay: 0.00s; }
  .color-2 { animation-delay: 0.333s; }
  .color-3 { animation-delay: 0.667s; }
  .color-4 { animation-delay: 1.00s; }
  .color-5 { animation-delay: 1.333s; }
  .color-6 { animation-delay: 1.667s; }

  @keyframes pillPulse {
    0% {
      transform: scale(1, 1);
    }
    
    10% {
      transform: scale(1.1, 1.2);
    }
    
    32.6%, 100% {
      transform: scale(1, 1);
    }
  }
</style>

    width: 100%;
    height: 100%;
    overflow: visible;
  }


  .trim-stroke {
    stroke-width: 18;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1322;
    stroke-dashoffset: -463;
    animation: retractStroke 3s cubic-bezier(0.25, 1, 0.25, 0) infinite;
  }

  @keyframes retractStroke {
    0% {
      stroke-dashoffset: -463;
    }
    33.33% {
      stroke-dashoffset: -1785; 
    }
    33.34%, 100% {
      stroke-dashoffset: -1785;
    }
  }

  
  .stroke-layer-4  { animation-delay: 0.000s; } 
  .stroke-layer-5  { animation-delay: 0.120s; } 
  .stroke-layer-10 { animation-delay: 0.240s; } 
  .stroke-layer-11 { animation-delay: 0.360s; } 
  .stroke-layer-13 { animation-delay: 0.480s; }

  .stroke-layer-16 { animation-delay: 1.720s; }

</style>
